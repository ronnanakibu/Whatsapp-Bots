version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ronnbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ronnbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ronn_secure_pass}
      POSTGRES_DB: ${DB_NAME:-ronnbot_radio}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ronnbot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redisdata:/data

  backend-api:
    image: node:18-alpine
    container_name: ronnbot-backend
    restart: unless-stopped
    working_dir: /usr/src/app
    command: npm run start:prod
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgres://${DB_USER:-ronnbot}:${DB_PASSWORD:-ronn_secure_pass}@postgres:5432/${DB_NAME:-ronnbot_radio}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass}
      JWT_SECRET: ${JWT_SECRET:-make_this_a_long_random_hash}
    ports:
      - "${API_PORT_HOST:-3000}:${API_PORT:-3000}"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
